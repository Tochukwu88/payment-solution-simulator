services:
  api:
    build: .
    image: frontier-dental-api
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      CLIENT_URL: http://localhost:3000
      LOG_LEVEL: info
      LOG_DIRECTORY: /app/logs
      API_DOCS_ENABLED: "true"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
